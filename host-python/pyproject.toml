[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dreamlayer"
version = "0.9.2"
description = "Memory engine for Brilliant Labs Halo glasses"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
dependencies = [
    "Pillow>=10",
    "numpy>=1.26",
    "openai>=1.30",
]

# The `dreamlayer` CLI: build, validate, package, and install plugins.
# Stdlib-only, so it ships with the base install.
[project.scripts]
dreamlayer = "dreamlayer.cli:main"

[project.optional-dependencies]
# lupa runs the halo-lua test suites (pinned to lupa.lua53 = device Lua)
dev      = ["pytest>=8,<10", "pytest-asyncio>=0.23,<2", "lupa>=2.0,<3", "pytest-benchmark>=4,<6", "hypothesis>=6,<7", "pytest-cov>=4,<8", "qrcode>=7,<9", "ruff>=0.5,<1", "mypy>=1.8,<3"]
# proofs: CrossHair symbolically verifies the on-glass safety caps in
# reality_compiler/v2/contracts.py (skipped when crosshair-tool is absent).
verify   = ["crosshair-tool>=0.0.60,<1"]
# mutation: mutmut mutation-tests the safety core — proves the tests actually
# catch bugs, not just pass. Run on demand: see .github/workflows/mutation.yml.
mutation = ["mutmut>=3.0,<4"]
hardware = ["brilliant-ble>=3,<4", "brilliant-msg>=7,<8"]
dream    = ["brilliant-msg>=7,<8", "Pillow>=10"]   # pip install dreamlayer[dream]

# --- Optional integration groups (adapters lazy-import these; every one has a
#     working fallback, so the core system runs with none of them installed) ---
memory   = ["sqlite-vec>=0.1,<1", "chromadb>=1,<2", "sentence-transformers>=5,<6", "model2vec>=0.8,<1", "lancedb>=0.34,<1", "usearch>=2,<3", "docarray>=0.41,<1", "networkx>=3,<4"]
# piper-tts is capped BELOW 1.3 on a licence boundary, not a compatibility one.
# The project moved from rhasspy/piper (MIT) to OHF-voice/piper1-gpl at 1.3.0
# and is GPL-3.0-or-later from there on, because it links espeak-ng. DreamLayer
# is Apache-2.0 and `voice` is not an opt-in extra — it is in profile-phone and
# profile-mac, so it ships. `>=1.2,<2` spanned the relicense, and the stale lock
# is why nothing said so: dependency-review and pip-audit both read uv.lock, and
# piper-tts had never been in it. To go past 1.3 somebody has to decide the
# licensing question on purpose; the API side is already handled (tts_piper.py
# calls synthesize_wav when it is there).
voice    = ["silero-vad>=6,<7", "faster-whisper>=1,<2", "openwakeword>=0.6,<1", "sounddevice>=0.5,<1", "sherpa-onnx>=1,<2", "piper-tts>=1.2,<1.3", "kokoro>=0.9,<1"]
# zero-shot voice cloning (Juno speaks in her own voice, offline) — heavy (torch),
# opt-in only, so it is NOT in any deployment profile: `pip install dreamlayer[voice-clone]`
voice-clone = ["coqui-tts>=0.24,<1"]

# `pydantic-ai` was dropped from this group with the `typed_pipeline` claim
# (#577): the only code that named it was an availability probe, and the wheel
# brings ~60 packages (anthropic, google-genai, logfire, opentelemetry, …) that
# every `structured` install — and so profile-phone/mac/cloud — was paying for.
# The group itself stays; `outlines`/`instructor`/`pydantic` are its real members.
structured = ["outlines>=1,<2", "instructor>=1,<2", "pydantic>=2,<3"]
llm      = ["litellm>=1,<2"]
intelligence = ["speechbrain>=1,<2", "spacy>=3,<4", "river>=0.23,<1", "human-learn>=0.3,<1", "supervision>=0.29,<1"]
# a tiny generalist NER (GLiNER) for sharper commitment / entity extraction than
# the regex + spaCy path — opt-in, so not in any deployment profile.
nlp-extra = ["gliner>=0.2,<1"]
vision   = ["ultralytics>=8,<9", "moondream>=1,<3", "open-clip-torch>=3,<4", "rapidocr-onnxruntime>=1.3,<2", "zxing-cpp>=2,<4", "coremltools>=9,<10; sys_platform=='darwin'", "mlx-vlm>=0.6,<1; sys_platform=='darwin'"]
# on-device document + math reading, atop the OCR path (opt-in, heavy)
math-ocr = ["pix2tex>=0.1,<1"]
doc-ocr  = ["surya-ocr>=0.6,<1"]
# monocular depth (Depth Anything V2 via transformers) — spatial sense from one camera
depth    = ["transformers>=4.40,<6"]
# live speech-to-speech interpreter (Meta SeamlessM4T-v2 via transformers) — the ear
# half of Rosetta; audio stays on the Brain. Opt-in, heavy, not in any profile.
interpreter = ["transformers>=4.40,<6", "sentencepiece>=0.2,<1"]
# non-speech sound recognition (PANNs / AudioSet) — the glasses hear the world:
# alarms, kettle, doorbell, glass. Classifies sound TYPES, never voiceprints. Opt-in.
sound-events = ["panns-inference>=0.1,<1"]
# birdsong recognition (BirdNET — 6,000+ species from sound, Pi-Zero-sized) — the
# world narrates itself on a walk. Opt-in, not in any profile.
birds = ["birdnetlib>=0.18,<1"]
# the "look up" lens (Skyfield) — planets + ISS passes from LOCAL data files
# (de421.bsp, stations.tle in $DL_SKY_DIR); the lens itself never downloads. Opt-in.
sky = ["skyfield>=1.45,<2"]
# off-grid tincan (Meshtastic) — LoRa mesh text via a local node (USB/LAN). Opt-in.
mesh = ["meshtastic>=2.3,<3"]
# universal WASM plugin host (Extism) — untrusted plugins in any language, made
# incapable rather than inspected. Opt-in.
extism = ["extism>=1,<2"]
# temporal knowledge-graph recall (LightRAG) — "what's connected, and when", built
# by your OWN local model + embedder. Opt-in, heavy, so not in any deployment profile.
memory-graph = ["lightrag-hku>=1,<2"]
# spaced-repetition rehearsal (py-fsrs, the scheduler behind modern Anki) — the
# baseline expanding-interval scheduler needs nothing; this personalizes it. Opt-in.
srs = ["fsrs>=4,<7"]
# neural fast-style-transfer for Dream Mode (see the world as a painting) — the
# ONNX runtime; you supply the .onnx style model. Opt-in, not in any profile.
dream-style = ["onnxruntime>=1.17,<2"]
# on-device face recognition of people you INTRODUCED (InsightFace buffalo_l:
# SCRFD detect + ArcFace r50, 512-d, ONNX/CPU). Deliberately in NO deployment
# profile: a default install has no face model and declines every frame. It also
# does nothing until the wearer turns face_recognition on, and never matches
# anyone who was not consensually enrolled — there is no stranger lookup and no
# face database beyond your own contacts. See truth_lens/face_backends.py.
face = ["insightface>=0.7,<2", "onnxruntime>=1.17,<2"]
# data-over-sound (ggwave — near-ultrasonic audio chirps, from the llama.cpp
# author) — transmit small payloads between devices as sound. A QR-free pairing
# fallback: the Brain sings a code, the phone catches it out of the air. Opt-in,
# tiny; absent the wheel the pairing QR path is unchanged.
soundlink = ["ggwave>=0.4,<1"]
# serverless, conflict-free multi-device Vault sync (reality_compiler/v2/vault_sync.py)
sync     = ["loro>=1.0,<2"]
infra    = ["rich>=14,<16", "watchdog>=6,<7", "zeroconf>=0.150,<1", "datasette>=0.65,<1", "rerun-sdk>=0.34,<1"]
# Security-critical: keep a floor below which known CVEs live (audit 2026-08-03).
# cryptography>=50 clears three advisories that landed against 48.0.1, and the
# CAP had to move with the floor — `<50` would have kept the worst of them:
#
#   GHSA-g6cj-pr64-35w5 (CVE-2026-69247)  fixed 50.0.0  PKCS#7 EnvelopedData
#       decryption leaks a Bleichenbacher oracle through distinguishable errors
#       and timing. This is the one the old ceiling blocked.
#   GHSA-m2h6-j472-rp4c (CVE-2026-69248)  fixed 49.0.0  the verifier accepts
#       wildcard DNS names, escaping permittedSubtrees name constraints.
#   GHSA-jwv3-5hgf-82ww (CVE-2026-69249)  fixed 49.0.0  duplicate self-signed
#       intermediates drive exponential path-building.
#
# The previous floor (48.0.1, audit 2026-07-14) cleared GHSA-537c-gmf6-5ccf,
# which the unconstrained resolver otherwise settled below at 46.0.7. Nothing
# else in the tree caps cryptography — checked against uv.lock, where every
# other consumer (c2pa-python, presidio-anonymizer, google-auth, secretstorage)
# depends on it without a specifier — so `<51` is ours to move next time.
# presidio floors match the modern analyzer API. pip-audit (dep-audit.yml)
# gates the rest, and is what caught these.
privacy  = ["cryptography>=50,<51", "presidio-analyzer>=2.2,<3", "presidio-anonymizer>=2.2,<3", "anyio>=4,<5", "c2pa-python>=0.36,<1", "keyring>=24,<26"]
platform = ["pluggy>=1,<2", "pyee>=13,<14", "argostranslate>=1,<2", "fastapi>=0.139,<1", "uvicorn>=0.51,<1", "pylsl>=1,<2", "wasmtime>=46,<48", "cbor2>=6,<7", "mlx>=0.32,<1; sys_platform=='darwin' and platform_machine=='arm64'", "mlx-lm>=0.31,<1; sys_platform=='darwin' and platform_machine=='arm64'"]

# --- Deployment profiles: one install per target, composed from the groups
#     above via self-referential extras. Pick ONE per machine:
#       pip install -e ".[profile-mac]"        (or: uv sync --extra profile-mac)
#     `python -m dreamlayer.capabilities` then reports what switched on.
#     tests/test_capabilities.py asserts these stay in sync with capabilities.py. ---
profile-halo  = ["dreamlayer[hardware]"]                       # bridge host next to the glasses: BLE only
profile-phone = ["dreamlayer[memory,voice,structured,llm]"]    # pocket hub: local recall + STT, no heavy vision
profile-mac   = ["dreamlayer[memory,voice,structured,llm,intelligence,vision,infra,privacy,platform]"]  # the full Brain
profile-cloud = ["dreamlayer[structured,llm,intelligence,privacy]"]  # remote runner: reasoning, no device/local-model stack

[tool.uv]
# The brilliant-msg extras (glasses-bridge host: pillow>=11) and the
# moondream/vision extras (Mac Brain: pillow<11) pin incompatible pillow
# ranges. They target different machines — the profiles above say "pick ONE
# per machine" — so declare every cross-machine pair conflicting instead of
# letting the incompatibility block the universal lock.
#
# birds/infra is a different shape of the same problem and worth being plain
# about, because it costs something real. birdnetlib hard-pins watchdog==2.1.9;
# the infra extra needs watchdog>=6 for the filesystem watcher. That is not a
# per-machine split — both would run on the same Mac — so declaring it means
# `bird_song` and `fs_watch`/`lan_discovery`/`dashboard` genuinely cannot
# co-install in one environment until birdnetlib relaxes its pin. The
# alternative is worse: without the declaration `uv lock` cannot resolve at
# all, so the lock silently rots and NOTHING gets a reproducible install.
# `birds` ships in no profile (it is opt-in); `infra` is in profile-mac only.
conflicts = [
    [{ extra = "dream" },        { extra = "vision" }],
    [{ extra = "dream" },        { extra = "profile-mac" }],
    [{ extra = "hardware" },     { extra = "vision" }],
    [{ extra = "hardware" },     { extra = "profile-mac" }],
    [{ extra = "profile-halo" }, { extra = "vision" }],
    [{ extra = "profile-halo" }, { extra = "profile-mac" }],
    [{ extra = "dream" },        { extra = "doc-ocr" }],
    [{ extra = "hardware" },     { extra = "doc-ocr" }],
    [{ extra = "profile-halo" }, { extra = "doc-ocr" }],
    [{ extra = "birds" },        { extra = "infra" }],
    [{ extra = "birds" },        { extra = "profile-mac" }],
    [{ extra = "math-ocr" },     { extra = "vision" }],
    [{ extra = "math-ocr" },     { extra = "profile-mac" }],
]

[tool.setuptools.package-data]
# ship the control-panel imagery (cinematic stills, HUD explainer thumbnails)
# so it's installed with the package and lands in the py2app .dmg bundle.
dreamlayer = [
    "ai_brain/server/assets/*.webp",
    "ai_brain/server/assets/*.png",
    "ai_brain/server/assets/*.woff2",
    "ai_brain/server/assets/*.js",    # halo-sim.js — the TRUE renderer behind Learn
    "ai_brain/server/assets/*.mp3",   # Juno's voice takes (click her, she talks)
    "ai_brain/server/assets/*.txt",   # common_words.txt — Lexicon's rarity gate
                                      # (missing from the wheel = no gate = every
                                      # long word looks rare)

    # the vendored on-device Live Lens detector (MediaPipe loader + WASM + int8
    # model), served same-origin so the in-browser recognizer works with zero
    # external fetch — MUST land in the wheel + the .dmg or the detector 404s.
    "ai_brain/server/assets/mediapipe/*.mjs",
    "ai_brain/server/assets/mediapipe/wasm/*.js",
    "ai_brain/server/assets/mediapipe/wasm/*.wasm",
    "ai_brain/server/assets/mediapipe/models/*.tflite",
    "ai_brain/server/assets/mediapipe/models/*.task",

    "models.lock",                    # model_guard sha256 pins (ship with the wheel)
    "plugins/dreamlayer.wit",         # WASM Component Model capability contract
    "plugins/first_party.json",       # content-hash pins for the reviewed first-party catalogue
    "py.typed",                       # PEP 561: ship inline types to SDK consumers
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Gate on the rules that catch real defects, not house style. The codebase
# deliberately uses compact one-liners (semicolons, colon-bodies) in the data
# layer, so the E7-series style rules are out; pyflakes (F) is the signal —
# unused imports/vars, redefinitions, undefined names, f-strings with no
# placeholder — plus E9 (syntax/IO errors). A clean tree here means a
# contributor can't quietly land dead code.
#
# The six bugbear rules below are here on the SAME test — each catches a
# defect, none is a style opinion — and every one of them was already at zero
# findings when it was added, so they cost no churn and only ever fire on
# something new. The rest of bugbear is deliberately out: B905 (zip strict)
# alone is 50 hits of house style, and B017/B018/B023 flag patterns this tree
# uses on purpose (a lambda consumed synchronously inside its own loop
# iteration; a `pytest.raises(Exception)` that predates narrower types).
#
#   B006  a mutable default argument, shared across every call — the shape
#         that leaks state between tests and looks like somebody else's bug
#   B012  break/return/continue inside `finally`, which SWALLOWS the in-flight
#         exception. This tree is full of fail-closed try/except; one of these
#         would turn a refusal into a silent success
#   B019  lru_cache on a method, pinning instances alive
#   B026  star-arg unpacking after a keyword argument
#   B032  `x: y` where `x = y` was meant — an annotation that assigns nothing
#         and reads exactly like a statement that does
#   B035  a dict comprehension with a static key, collapsing every entry to one
#   B018  a bare expression statement — `x == y` where `x = y` was meant, a
#         no-op that reads exactly like an assignment
select = ["F", "E9", "B006", "B012", "B018", "B019", "B026", "B032", "B035"]

[tool.ruff.lint.per-file-ignores]
# Package __init__.py files re-export their public surface; those imports are
# "unused" only to a linter.
"__init__.py" = ["F401"]
# Tests routinely bind an intermediate to name a step (`before = count()`), so
# unused-local (F841) is noise there; the source tree is held to it.
"src/dreamlayer/tests/*" = ["F841"]

[tool.mypy]
# The whole `dreamlayer` package is type-checked in CI (was 4 of 323 files
# behind --follow-imports=skip; audit 2026-07-14, Type-Safety C+ -> A-). A
# pragmatic baseline — NOT --strict: untyped function bodies aren't forced, but
# every annotation that *is* written is held to, and the mixin<->host contract
# (orchestrator ops_*/_ops_host, ai_brain brain_*/_brain_host) is now enforced.
python_version = "3.11"
# src/ layout: makes both `mypy src/dreamlayer` and `mypy -p dreamlayer` work.
mypy_path = "src"
explicit_package_bases = true
# Optional integration deps (presidio, loro, brilliant-ble, sherpa, watchdog,
# …) are absent in the typecheck env by design; every adapter has a fallback.
ignore_missing_imports = true
# Type the whole tree without cascading into deliberately-untyped third-party
# internals — the imports themselves are still resolved and their public API
# checked.
follow_imports = "silent"

# --- Gradual-typing backlog (ignore_errors) ---------------------------------
# Leaf/subsystem modules whose types come from dynamic dispatch, an untyped
# optional dependency, or lazy plumbing. Each is documented; the rest of the
# tree (incl. the four safety-core files) is clean and enforced.
#
# This list is mirrored by DECIDED_TYPE_BACKLOG in tests/test_lockfile.py,
# which asserts it in both directions — the count used to be stated here in
# prose ("Four") and had already drifted to five with nothing able to tell.
# Adding a module here without a row there fails the suite, on purpose:
# switching the type gate off for a file should cost a sentence.
[[tool.mypy.overrides]]
module = [
    # QR bit-matrix built as list[list[int|None]] and filled in place — pure
    # plumbing, annotating the None->int transitions carries no correctness.
    "dreamlayer.ai_brain.server.qr",
    # The beat->scene compiler threads several Optionals (beat.parsed, the
    # running scene, duration_sec) through a dynamic walk: a real typing task,
    # not a one-liner.
    "dreamlayer.reality_compiler.v2.choreographer",
    # The NL->BehaviorIntent parser emits runtime-validated strings that mypy
    # can't narrow to the Intent dataclasses' Literal fields (RED/YELLOW, click
    # triggers).
    "dreamlayer.reality_compiler.intent_parser",
    # The BLE transport: its client comes from the optional `brilliant-ble`
    # dependency and is None until a device connects. Hardware-gated and not
    # exercised by the device-free test suite.
    "dreamlayer.bridge.real_bridge",
    # The loro (CRDT) sync bridge: every value read out of a LoroDoc is the deep
    # union `float|int|bytes|str|list[LoroValue]|dict[...]|ContainerID|None`, so
    # each `.get(...)` is a union-attr storm. The audit called this out verbatim
    # — "vault_sync is out on purpose: its types come from loro's LoroValue
    # union, a CRDT-plumbing typing task, not part of the proof."
    "dreamlayer.reality_compiler.v2.vault_sync",
]
ignore_errors = true

# --- Third-party library whose inline (py.typed) stubs are version-volatile
# and NOT our contract to check ---------------------------------------------
# Pillow's stubs move constants between releases (Image.NEAREST/LANCZOS/ADAPTIVE)
# and type PixelAccess/ImageFont as Optional. Following its imports makes the
# gate depend on whether Pillow's stubs are the installed version — the SAME
# `mypy src/dreamlayer` gave 0 errors under one interpreter and 18 PIL errors
# under another. Skipping PIL's import makes every call into it `Any` —
# deterministic across environments — without weakening the checking of OUR
# code, which is what this gate is for.
[[tool.mypy.overrides]]
module = ["PIL", "PIL.*"]
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["src/dreamlayer/tests", "src/dreamlayer/tests"]
markers = [
    "hardware: needs a real Halo device / hardware deps (deselected in CI)",
    "benchmark: latency-budget test via pytest-benchmark (deselected in CI)",
    "real_model: needs a real backend installed (MiniLM, CLIP, model2vec, silero-vad, faster-whisper, presidio+en_core_web_sm); deselected in the default job, run by the real-models workflow — which installs every one of those and FAILS if any marked test skips, so adding a mark here means adding the dep there",
    "allow_egress: opts a test OUT of the autouse no-cloud-egress audit hook (rare; for a test that must reach a public host). Loopback/RFC-1918 LAN never needs this.",
    "no_face_double: opts a test OUT of the autouse face-embedder test double, so it sees the PRODUCTION FaceEmbedder — which declines, because there is no face model. Used to assert the shipped build never names anyone.",
]

[tool.mutmut]
# Mutation-test the whole on-glass safety core (P2-13 widened this from
# contracts.py alone): the caps the "data, not code" argument rests on
# (contracts.py), the static prover (budgets.py), the WCAG eye-safety analyzer
# (flash_safety.py), and the deploy trust anchor (signer.py). Each file has a
# dedicated killer suite listed below; the CrossHair proofs are complementary
# but blind to mutmut (it swaps the body behind a dispatcher CrossHair's
# source read can't see). vault_sync.py stays out: it needs the loro extra,
# which the mutation runner doesn't install.
#
# memory/privacy.py joins the core (audit 2026-07-14 §7): the privacy gate is
# the product's core safety contract, yet it previously had NO mutation net —
# only the 4-file reality_compiler core did. Mutating it here proves the gate's
# killer suite (test_privacy.py + tests/test_privacy_gate_properties.py) would
# actually catch an OR->AND flip or an incognito-blocks-recall regression, not
# just pass. The @requires_capture/@requires_recall call-site helpers live in
# the same file, so they come under the net for free ("the gate call-sites'
# helper" from the task) — no separate file to configure.
#
# Enforcement (.github/workflows/mutation.yml) is per-file survivor CEILINGS,
# not a blanket zero: contracts.py and signer.py hold at zero survivors, while
# budgets.py and flash_safety.py carry documented non-behavioral residuals
# (mutants of diagnostic message strings and provably-equivalent forms — see
# test_budgets_boundaries.py / test_flash_safety_unit.py docstrings). The
# ceilings are the measured residual counts, so any NEW test hole still fails
# the job while the documented residue doesn't ratchet.
source_paths = ["src/dreamlayer"]
only_mutate = [
    "src/dreamlayer/reality_compiler/v2/contracts.py",
    "src/dreamlayer/reality_compiler/v2/budgets.py",
    "src/dreamlayer/reality_compiler/v2/flash_safety.py",
    "src/dreamlayer/reality_compiler/v2/signer.py",
    "src/dreamlayer/memory/privacy.py",
]
pytest_add_cli_args_test_selection = [
    "src/dreamlayer/tests/test_contracts_unit.py",
    "src/dreamlayer/tests/test_budgets_boundaries.py",
    "src/dreamlayer/tests/test_rc2_budgets.py",
    # The two graph algorithms #530 put behind the flood check, tested
    # directly. Listing it here is the point: a killer suite mutmut is not
    # told to run cannot kill anything, and the survivor count would not
    # move however good the tests were.
    "src/dreamlayer/tests/test_budgets_cycle_math.py",
    "src/dreamlayer/tests/test_flash_safety_unit.py",
    "src/dreamlayer/tests/test_flash_safety.py",
    "src/dreamlayer/tests/test_signer_boundaries.py",
    "src/dreamlayer/tests/test_rc2_vault.py",
    "src/dreamlayer/tests/test_privacy.py",
    "src/dreamlayer/tests/test_privacy_gate_properties.py",
]
