# Automated dependency-update PRs (audit 2026-07-14: the repo had no
# supply-chain automation). Weekly, grouped, so a CVE fix or a floating-dep
# bump arrives as a reviewable PR rather than a silent latest-resolve.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/host-python"
    schedule:
      interval: "weekly"
    groups:
      python-deps:
        patterns: ["*"]
        # Majors stay OUT of the group, for the reason the phone-app group
        # below learned first (#334). It happened here too: one grouped PR
        # (#618) carried an insightface 0.7→1.0 major on the FACE-RECOGNITION
        # backend alongside an unrelated ceiling change, as a single
        # all-or-nothing review. Minors/patches — including security fixes —
        # still flow automatically and grouped; a major now arrives on its own
        # so it can be judged on its own.
        update-types: ["minor", "patch"]
    # A few bounds in pyproject.toml are a decision written down, not a
    # compatibility guess, and a bot cannot read the comment above them.
    ignore:
      # piper relicensed at 1.3.0: rhasspy/piper (MIT) became
      # OHF-voice/piper1-gpl (GPL-3.0-or-later — it links espeak-ng).
      # DreamLayer is Apache-2.0 and `voice` ships in profile-phone and
      # profile-mac, so anything >=1.3 puts strong copyleft in a shipped
      # extra. #618 proposed exactly that, four hours after #609 capped it,
      # and every gate went green — dependency-review reads the graph diff and
      # a pyproject-only change presents no new package. Moving past 1.3 is a
      # licensing decision a human makes; test_lockfile.py::
      # TestABoundThatEncodesADecisionStaysPut is the other half of this.
      - dependency-name: "piper-tts"
        versions: [">=1.3"]
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/phone-app"
    schedule:
      interval: "weekly"
    groups:
      phone-deps:
        patterns: ["*"]
        # Majors stay OUT of the group: the first grouped run proposed an
        # entire Expo SDK 54→57 platform migration (RN, React, TS 7, jest 30,
        # zustand 5) as one unreviewable, CI-red PR (#334). Minors/patches
        # flow automatically; majors arrive as individual PRs — except the
        # Expo-coupled platform set below, which only moves together via a
        # deliberate `npx expo install` SDK migration.
        update-types: ["minor", "patch"]
    # The Expo SDK pins exact versions of these — even a "minor" RN bump broke
    # jest-expo (#339: RN's jest preset moved packages mid-0.8x), and jest-expo
    # itself pins the jest major (#341) while RNTL targets specific RN lines
    # (#343). None of them can move outside an `npx expo install` SDK
    # migration, so Dependabot never proposes ANY update for them.
    ignore:
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "react-native"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "jest-expo"
      - dependency-name: "jest"
      - dependency-name: "@types/jest"
      - dependency-name: "@testing-library/react-native"
      # Also `npx expo install`-managed: their release lines track RN versions
      # (screens 4.26 requires RN 0.84+, vs the SDK-54-pinned 0.81), and jest
      # mocks native modules so CI cannot catch the mismatch (#346).
      - dependency-name: "react-native-screens"
      - dependency-name: "react-native-safe-area-context"
      - dependency-name: "react-native-svg"
      - dependency-name: "react-native-web"
      - dependency-name: "@react-native-async-storage/async-storage"
      # typescript is SDK-blessed too: `npx expo install --fix` pins the TS
      # the SDK validates against (~6.0 for SDK 57); TS 7 broke typecheck
      # (#334, #348). Moves with SDK migrations, not bot bumps.
      - dependency-name: "typescript"
      # @noble crypto: the receipt-verification code targets the v1 API
      # (ed.etc.sha512Sync, ed.getPublicKey→hex, sha256/sha512 from
      # @noble/hashes/*). The v2 majors reshaped both surfaces (#473/#475 were
      # CI-red and closed); a major moves only with a deliberate code migration,
      # so ONLY semver-major is ignored — minor/patch (incl. security fixes)
      # still flow automatically.
      - dependency-name: "@noble/ed25519"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@noble/hashes"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    groups:
      web-deps:
        patterns: ["*"]
    open-pull-requests-limit: 5

  # registry-api is the Cloudflare Worker (worker.js). It ships no runtime npm
  # dependencies today (tests use node builtins), so Dependabot has nothing to
  # bump yet — this entry future-proofs it: any dep added to its package.json is
  # monitored from day one rather than silently floating.
  - package-ecosystem: "npm"
    directory: "/registry-api"
    schedule:
      interval: "weekly"
    groups:
      registry-api-deps:
        patterns: ["*"]
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # All 70 action use-sites are SHA-pinned (#468); without a group each
      # pinned-SHA refresh opens its OWN PR — a steady flood across 26 workflows.
      # Collapse them into ONE reviewable PR per weekly run.
      actions-deps:
        patterns: ["*"]
    open-pull-requests-limit: 5
