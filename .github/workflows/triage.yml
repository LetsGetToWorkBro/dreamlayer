name: triage

# What nobody is looking at, once a week, in one issue.
#
# This repository's expensive failures have not been bad code — they have been
# things nobody was looking at, staying broken. mutation.yml went red on
# 2026-07-27 and stayed red for a fortnight while every PR showed a full row of
# green checks. The memory spine's tests and the plugin sandbox's capability
# proof were `importorskip`-gated on wheels CI installed for nobody, so they ran
# in no environment at all. A contributor's finding about that sandbox sat eight
# days unanswered.
#
# None of those needed anybody to be cleverer. They needed something to put them
# in front of the one person who could act.
#
# It REPORTS. It does not fix, and it does not gate. That is deliberate: the
# cheapest way to make a red mutation gate green is to raise its survivor
# ceiling, a one-line diff that satisfies every check and makes the product
# worse. The noticing is mechanical; the judgement is not.
#
# The only thing that fails this job is the scan having examined nothing — see
# scripts/triage.py's `vacuous()`. A triage tool that quietly stops scanning
# prints the same "nothing to report" as a healthy repository, which is the
# exact failure it exists to catch.

on:
  schedule:
    - cron: "0 8 * * 1"      # Mondays 08:00 UTC, after the weekly mutation run
  workflow_dispatch:
  # Also on changes to the loop itself, so a PR that edits the script runs it.
  # dep-audit learned this the hard way: `push` fires on the FORK for a fork PR
  # and never here, so pull_request is the only trigger a contributor's change
  # can reach.
  push:
    paths:
      - "scripts/triage.py"
      - ".github/workflows/triage.yml"
  pull_request:
    paths:
      - "scripts/triage.py"
      - ".github/workflows/triage.yml"

permissions:
  contents: read
  issues: write            # the report lands in an issue, not a log

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Scan
        id: scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Stdlib only — no pip install. A triage job that breaks on a
          # dependency resolution is a triage job that stops reporting, and
          # nobody notices that either.
          python scripts/triage.py | tee "$RUNNER_TEMP/triage.md"

      - name: Open or update the report
        # Not on pull_request: a PR that edits the script should RUN it (the
        # step above is the real check there), not file an issue on every push.
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail
          # One issue, updated — not a new one every week. A weekly issue
          # becomes a stream people mute, which is how the report joins the
          # things nobody reads.
          num=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/issues?state=open&labels=triage&per_page=1" \
            | python -c "import json,sys; d=json.load(sys.stdin); print(d[0]['number'] if d else '')")
          payload=$(python - <<'PY'
          import json, os
          body = open(os.environ["RUNNER_TEMP"] + "/triage.md").read()
          print(json.dumps({
              "title": "Triage: what nobody is looking at",
              "body": body + "\n\n---\n_Refreshed weekly by "
                             "`.github/workflows/triage.yml`. It reports; it "
                             "does not fix._\n",
              "labels": ["triage"],
          }))
          PY
          )
          if [ -n "$num" ]; then
            curl -sS -X PATCH -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/issues/$num" \
              -d "$payload" -o /dev/null
            echo "updated issue #$num"
          else
            curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/issues" \
              -d "$payload" -o /dev/null
            echo "opened a new triage issue"
          fi
