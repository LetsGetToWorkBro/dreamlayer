name: Build Windows app (installer)

# Builds the double-click DreamLayer Brain system-tray app with PyInstaller,
# wraps it in a per-user Inno Setup installer, smoke-launches the exe, and
# uploads the artifact. Manual (Run workflow) or on a version tag (v*) — the
# same triggers as the macOS pipeline. Does NOT run on normal pushes/PRs, so
# it never gates regular CI.
#
# Optional repo secrets (Settings -> Secrets and variables -> Actions) turn on
# Authenticode signing of both the exe and the installer:
#   WINDOWS_CERT_PFX_BASE64   code-signing cert + key, exported .pfx, base64-encoded
#   WINDOWS_CERT_PASSWORD     password for that .pfx
# Unsigned builds still work — Defender SmartScreen shows "More info -> Run
# anyway" on first launch (packaging/README.md documents this the way it
# documents Gatekeeper for unsigned .dmg builds).
#
# Publishing mirrors build-macos-app.yml: a `v*` tag build attaches the
# installer to the Release for that tag; a manual run publishes only when the
# `publish` box is ticked, tagged from the package __version__.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Also publish the installer as a Release on this repo"
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: write     # so a tag build can attach the installer to a Release
  id-token: write     # OIDC token the provenance signer exchanges (SLSA)
  attestations: write # write the build-provenance attestation for the installer
  actions: write     # dispatch sign-release after publishing — see below

jobs:
  build:
    runs-on: windows-latest
    env:
      # signing is optional: on only when the cert secret exists
      HAVE_CERT: ${{ secrets.WINDOWS_CERT_PFX_BASE64 != '' }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install app + build tooling
        run: |
          python -m pip install --upgrade pip wheel
          pip install ./host-python          # dreamlayer + Pillow/numpy/openai
          # Starter capabilities baked in, same as the .dmg (small wheels, no
          # models): zeroconf -> the phone finds the Brain on the LAN;
          # cryptography -> Ed25519 provenance signatures.
          pip install zeroconf cryptography
          pip install pystray                # the system-tray shell
          pip install pywebview              # WebView2 for the native panel window
          pip install pyinstaller

      - name: Build dreamlayer.ico + installer wizard art from the shared art
        run: |
          cd host-python/packaging/windows
          python make_ico.py
          python make_installer_art.py

      - name: Build the app (PyInstaller, windowed one-dir)
        run: |
          cd host-python/packaging/windows
          pyinstaller DreamLayer.spec --noconfirm

      - name: Import signing certificate
        if: env.HAVE_CERT == 'true'
        env:
          PFX: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx",
            [Convert]::FromBase64String($env:PFX))

      - name: Sign DreamLayer.exe
        if: env.HAVE_CERT == 'true'
        env:
          PFX_PASS: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          & $signtool.FullName sign /f "$env:RUNNER_TEMP\cert.pfx" /p "$env:PFX_PASS" `
            /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
            host-python/packaging/windows/dist/DreamLayer/DreamLayer.exe

      # A signature nobody verifies is a signature nobody can rely on. macOS runs
      # `codesign --verify --deep --strict` unconditionally; Windows signed and
      # never checked, so a partial sign — or a missing timestamp because
      # timestamp.digicert.com was unreachable — shipped silently. /tw is what
      # makes an untimestamped signature an error rather than a warning.
      - name: Verify the exe signature
        if: env.HAVE_CERT == 'true'
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          & $signtool.FullName verify /pa /tw `
            host-python/packaging/windows/dist/DreamLayer/DreamLayer.exe
          if ($LASTEXITCODE -ne 0) { throw "exe signature did not verify" }

      - name: Smoke-launch the exe
        # the CI stand-in for "double-click on a clean Windows 11 machine":
        # the windowed exe must boot the server, answer on :7777, mint a
        # first-run pairing token, and exit 0 in --smoke mode.
        run: |
          $exe = "host-python/packaging/windows/dist/DreamLayer/DreamLayer.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--smoke" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "smoke launch failed ($($p.ExitCode))" }
          $cfg = Get-Content "$env:USERPROFILE\.dreamlayer\brain_config.json" | ConvertFrom-Json
          if (-not $cfg.token) { throw "first-run pairing token was not minted" }
          Write-Host "smoke OK - server answered and token minted"

      - name: Resolve version
        id: ver
        run: |
          $v = python -c "from dreamlayer import __version__ as v; print(v)"
          echo "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build the installer (Inno Setup)
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          cd host-python/packaging/windows
          & $iscc /DAppVersion=${{ steps.ver.outputs.version }} installer.iss
          Move-Item Output\DreamLayer-Setup.exe ..\..\..\DreamLayer-Setup.exe

      - name: Sign the installer
        if: env.HAVE_CERT == 'true'
        env:
          PFX_PASS: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          & $signtool.FullName sign /f "$env:RUNNER_TEMP\cert.pfx" /p "$env:PFX_PASS" `
            /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 DreamLayer-Setup.exe

      - name: Verify the installer signature
        if: env.HAVE_CERT == 'true'
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          & $signtool.FullName verify /pa /tw DreamLayer-Setup.exe
          if ($LASTEXITCODE -ne 0) { throw "installer signature did not verify" }

      # An UNSIGNED Windows build is documented, intended behaviour (see the
      # header): the secrets are optional and SmartScreen's "More info -> Run
      # anyway" is the accepted cost. What was NOT intended is a silent
      # signed-to-unsigned DOWNGRADE — blank or rotate the secret and a tagged
      # release publishes unsigned, green, with nothing in the run, the artifact
      # name, or the release body recording the loss. This makes the loss loud
      # without turning an intentionally-unsigned build red, and lets a repo opt
      # into strictness with a REQUIRE_WINDOWS_SIGNING variable.
      - name: Flag an unsigned build
        if: env.HAVE_CERT != 'true'
        run: |
          $msg = "This Windows build is UNSIGNED (no WINDOWS_CERT_PFX_BASE64 secret). SmartScreen will warn on first run."
          Write-Output "::warning title=Unsigned Windows build::$msg"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "> [!WARNING]`n> $msg"
          if ("${{ vars.REQUIRE_WINDOWS_SIGNING }}" -eq "true") {
            throw "REQUIRE_WINDOWS_SIGNING is set but no signing certificate is configured"
          }

      # SLSA build provenance: a signed, verifiable statement that this installer
      # came out of THIS repo's CI (this workflow, this commit), not a developer
      # box. Authenticode proves who signed; provenance proves the build origin.
      # Verify with `gh attestation verify DreamLayer-Setup.exe -R <owner>/<repo>`.
      - name: Attest build provenance (installer)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: DreamLayer-Setup.exe

      - name: Upload installer artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: DreamLayer-windows
          path: DreamLayer-Setup.exe

      - name: Resolve release tag
        id: rel
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            echo "tag=${{ github.ref_name }}" >> $env:GITHUB_OUTPUT
          } else {
            echo "tag=v${{ steps.ver.outputs.version }}" >> $env:GITHUB_OUTPUT
          }

      - name: Publish the Release (this repo)
        if: github.ref_type == 'tag' || inputs.publish
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: DreamLayer ${{ steps.rel.outputs.tag }}
          fail_on_unmatched_files: true
          files: DreamLayer-Setup.exe
          body_path: .github/RELEASE_NOTES.md

      - name: Dispatch keyless signing for the published release
        # `release: published` NEVER fires here: this release is published with
        # GITHUB_TOKEN, and events created by that token do not trigger other
        # workflows. workflow_dispatch is the documented exception, so we
        # dispatch sign-release ourselves. This is how v0.9.1 and v0.9.2 both
        # shipped UNSIGNED for weeks — the auto-trigger silently never fired,
        # and the two manual dispatches raced a draft.
        #
        # Both build workflows dispatch after their own upload; sign-release
        # enumerates whatever assets exist at run time and --clobbers, so the
        # later dispatch always completes the set. Racing is safe by design.
        if: github.ref_type == 'tag' || inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # bash explicitly: this job's default is pwsh (see defaults.run), where
        # the backslash continuation and $VAR syntax below would both break.
        shell: bash
        run: |
          gh workflow run sign-release.yml --repo "$GITHUB_REPOSITORY" \
            -f tag="${{ steps.rel.outputs.tag }}"
