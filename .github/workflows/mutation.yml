name: mutation

# Mutation testing for the on-glass safety core. The default `pytest` job proves
# the tests PASS; this job proves they actually CATCH BUGS — mutmut mutates the
# safety-core files (contracts.py, budgets.py, flash_safety.py, signer.py) plus
# the privacy gate (memory/privacy.py, the product's core safety contract; added
# by the audit 2026-07-14 §7 test-infra raise); see [tool.mutmut] in
# host-python/pyproject.toml, and checks the killer suites actually kill the
# mutants.
#
# The gate is a per-file survivor CEILING, not a blanket zero. contracts.py and
# signer.py hold at ZERO survivors. budgets.py and flash_safety.py carry a
# measured residue of non-behavioral mutants (mutations of diagnostic message
# strings, deps-absent degradation branches that can't execute with the deps
# installed, and provably-equivalent forms — itemized in the docstrings of
# test_budgets_boundaries.py and test_flash_safety_unit.py). Their ceilings are
# those measured counts, so any NEW survivor — a real test hole — still fails
# the job, while the documented residue doesn't ratchet. Lower a ceiling when
# you kill residue; never raise one without the same class of justification.
#
# THIS JOB CAN GO RED WITHOUT A CODE CHANGE, and that is working as intended.
# `mutation` installs mutmut fresh each run under `>=3.0,<4`, so a release that
# mutates MORE can turn an unchanged commit red. It happened on 2026-09-14:
# mutmut 3.8.0 (released 09-12) fixed "methods of decorated classes are not
# mutated" and added ternary-condition mutation, and the same commit that was
# green on 09-07 came back +23 survivors. The bound stays wide on purpose —
# every one of those 23 was reachable code nobody was testing, and seven had
# never been executed at all.
#
# So when this goes red with no diff to explain it: reproduce both versions
# before touching a ceiling. `pip install mutmut==<last green>` and
# `mutmut run` gives the baseline; the delta against the new version tells you
# whether the net widened or the tests rotted. Raising a ceiling to match a
# wider net, without reading the new survivors, is how a gate gets muted.
#
# Not on every push (it copies + re-runs per mutant); on demand + weekly.
# It is also NOT a PR gate, so nothing turns a pull request red when this
# breaks — the weekly triage loop (.github/workflows/triage.yml) is what
# noticed the 09-14 failure, and issue #637 is where it says so.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1"   # Mondays 07:00 UTC

permissions:
  contents: read   # least-privilege floor; jobs opt into more where needed

jobs:
  mutation:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.repository_owner == 'LetsGetToWorkBro'

    defaults:
      run:
        working-directory: host-python

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: host-python/pyproject.toml

      - name: Install with the mutation extra
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev,mutation]"

      - name: Run mutation testing on the safety core
        run: mutmut run

      - name: Enforce per-file survivor ceilings
        run: |
          mutmut results | tee /tmp/results.txt
          python - <<'PY'
          import re, sys
          from collections import Counter

          # Measured baselines (P2-13). "survived" and "no tests" both count —
          # an uncovered mutant is a hole exactly like a surviving one.
          CEILINGS = {
              "contracts": 0,       # the proof core: always zero
              "signer": 0,          # the deploy trust anchor: always zero
              # budgets.py — 229, measured. Was 213 until #530 replaced the
              # flood check's exponential cycle enumeration with two real
              # algorithms, which arrived with no direct tests: the count went
              # to 291 and THIS JOB HAS BEEN RED EVERY WEEK SINCE (2026-07-27
              # and 2026-08-03), unnoticed, because it is scheduled and never a
              # merge gate.
              #
              # test_budgets_cycle_math.py now tests the three functions
              # directly and killed 61 of them: _zero_time_cycle 25 -> 2 (the
              # two left set BLACK to 3 and to None, and BLACK is a sentinel —
              # any value that is neither WHITE nor GREY behaves identically),
              # _max_ratio_cycle 39 -> 17, _cycle_analysis 46 -> 29.
              #
              # The 229 is NOT a claim that the remaining 48 are all equivalent.
              # Every mutant that changes a VERDICT — a livelock missed, a flood
              # rate mis-derived, a ring reconstructed wrong, a dangling arc
              # admitted, the at-budget boundary — is killed and has a named
              # test. What is left is predominantly the class this file already
              # accepts for verify()'s 181: mutmut re-casing and wrapping
              # diagnostic message strings, and blanking Violation arguments,
              # which is engineer-facing text rather than behaviour. Some
              # cycle-reconstruction residue in _max_ratio_cycle is genuinely
              # not yet killed and is worth another pass.
              #
              # 229 -> 231 (2026-09-17), and the two are itemized because a
              # ceiling that moves without an itemization is just a ratchet.
              # mutmut 3.8.0 added "Mutate the condition of ternary
              # expressions", so two conditions became mutable that never were:
              #   _cycle_analysis: `hi = (1.0/min(durs))*len(nodes) if durs
              #     else 1e6` — forcing the else gives the ratio search a
              #     larger-but-still-valid upper bound, so it converges to the
              #     same rate. Equivalent, not a hole.
              #   verify: `_beat_of(fig, scene) if scene else None` — the beat
              #     is diagnostic metadata on a Violation, the same
              #     engineer-facing class as the message strings above.
              # The THIRD new ternary mutant was a real hole and is killed, not
              # accepted: `(t.target == SELF) or True` collapsed every timeout
              # hop into a self-loop, which a ring of equal scenes cannot see.
              # test_budgets_cycle_math.py's asymmetric-cycle test kills it.
              "budgets": 231,
              # flash_safety.py — 15, degradation branches + boundary-exact
              # forms. It went to 22 under mutmut 3.8.0 and is back at 15
              # because all seven new mutants were KILLED, not accommodated:
              # they were FlashReport.__str__, which no test had ever executed
              # (see test_report_strings.py — the one apparent reader was an
              # assert MESSAGE, which Python evaluates only on failure).
              "flash_safety": 15,
              # privacy.py — 1, MEASURED, as the previous comment here asked for.
              # It was a provisional analytic bound of 3 written when mutmut was
              # not installable in the authoring environment. Four scheduled runs
              # (2026-07-13, -07-20, -07-27, -08-03) and a local run all report
              # exactly 1.
              #
              # That mutant is `PrivacyGate.__init__`'s `self._incognito =
              # False` -> `None`, NOT set_incognito's `bool(on)` coercion as
              # this comment claimed until 2026-09-17 — mutmut show names it,
              # and the reasoning was right about the wrong line. It is
              # behaviourally identical for the reason given: the flag's only
              # reader is `_paused or _incognito`, and None is falsy exactly as
              # False is. The `return None` -> bare `return` idioms the margin
              # was reserved for do not survive.
              "privacy": 1,
          }

          # Documented non-zero residue, as a FLOOR. Every ceiling below is
          # `n <= ceiling` with n defaulting to 0, so a parse that matches
          # nothing reports every file clean and exits 0 — a green mutation gate
          # over an empty set, the failure this repo keeps meeting (CLAUDE.md
          # #1). mutmut's `results` output is not a stable API and a rename in
          # it would silently retire this whole job.
          #
          # These two files have residue that is understood and cannot go to
          # zero: ~180 of budgets.py's are mutmut re-casing verify()'s
          # diagnostic strings, and flash_safety.py's 15 are degradation
          # branches. A report of zero for either means the parse stopped
          # matching, not that somebody wrote extraordinary tests — and if they
          # did, they are editing this table anyway.
          #
          # contracts/signer are legitimately 0 and privacy is 1, so they get no
          # floor; the two below are enough to prove the parse still works.
          FLOORS = {"budgets": 100, "flash_safety": 5}

          per = Counter()
          for line in open("/tmp/results.txt"):
              m = re.match(
                  r"\s*dreamlayer\.(?:reality_compiler\.v2|memory)\.(\w+)\..*: "
                  r"(survived|no tests)$", line)
              if m:
                  per[m.group(1)] += 1

          failed = False
          for fname, floor in FLOORS.items():
              n = per.get(fname, 0)
              if n < floor:
                  print(f"::error::{fname}.py reported {n} survivors, below the "
                        f"documented floor of {floor}. The results parse has "
                        f"almost certainly stopped matching mutmut's output — "
                        f"every ceiling below would then pass on nothing.")
                  failed = True
          for fname, ceiling in CEILINGS.items():
              n = per.get(fname, 0)
              status = "OK " if n <= ceiling else "OVER"
              print(f"[{status}] {fname}.py: {n} survivors (ceiling {ceiling})")
              if n > ceiling:
                  failed = True
          unknown = set(per) - set(CEILINGS)
          if unknown:
              print(f"[OVER] survivors in files with no ceiling: {sorted(unknown)}")
              failed = True
          if failed:
              print("::error::A safety-core file exceeded its mutation-survivor "
                    "ceiling — the killer tests have a NEW hole.")
              sys.exit(1)
          print("All safety-core files within their survivor ceilings.")
          PY
