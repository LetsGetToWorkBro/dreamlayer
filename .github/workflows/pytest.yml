name: pytest

on:
  push:
  pull_request:

permissions:
  contents: read   # least-privilege floor; jobs opt into more where needed

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: host-python

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: host-python/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev,verify,sync]"   # verify→crosshair proofs, sync→loro CRDT
          # networkx on its own, NOT via the `memory` extra that declares it — that
          # extra also pulls chromadb, sentence-transformers and lancedb, which is
          # minutes of CI for one pure-Python graph library. It is here because the
          # relationship graph's networkx branches (greedy modularity in
          # particular — the whole point of the `social_graph` capability) are
          # `importorskip`-gated, so without it they were never executed by ANY
          # run: a green suite that had not tested the primary path.
          pip install "networkx>=3,<4"
          # The same argument, and the same shape of hole it closes. These five
          # gate ~90 `importorskip` tests that consequently ran in NO
          # environment: the memory spine's real vector stores (usearch,
          # sqlite-vec — recall at scale, purge/eviction, lifecycle, spine
          # coherence), the transport codec (cbor2), and the two infra seams
          # (watchdog, zeroconf). A memory product whose spine tests only ever
          # skipped is the vacuous-check problem at workflow scale.
          #
          # Listed individually rather than via `[memory,infra]`, which is the
          # whole point: those extras also declare chromadb,
          # sentence-transformers and lancedb — minutes of CI and hundreds of
          # megabytes. These five are 5.1 MB of wheels between them, so the
          # coverage is close to free. Anything heavy stays skipped on purpose.
          # Bounds copied from the extras that declare them (memory, infra,
          # platform), so this line cannot quietly install a version the project
          # does not accept. watchdog>=6 is the infra bound: `birds` pins
          # watchdog==2.1.9 and is a declared [tool.uv] conflict with infra, so
          # birdnetlib can never join this install — see the conflicts table.
          pip install "usearch>=2,<3" "sqlite-vec>=0.1,<1" "cbor2>=6,<7" \
                      "watchdog>=6,<7" "zeroconf>=0.150,<1"
          # wasmtime, and this one is a SECURITY boundary rather than a feature.
          # The plugin sandbox's runtime capability enforcement — a wasm plugin
          # granted only ["log"] importing dreamlayer.net_get must raise
          # CapabilityError — lives in four files that all open with
          # `pytest.importorskip("wasmtime")`. wasmtime is declared only in the
          # `platform` extra, which nothing here installs, so 105 tests
          # including that refusal ran in no environment at all: the strongest
          # boundary in the tree was green by skip.
          #
          # Reported by a contributor on #424 while proposing the isolation
          # work, and it is the same hole as the five above — the previous pass
          # took cbor2 out of `platform` and left its neighbour behind.
          #
          # 9.5 MB, and the 105 tests run in about 4 seconds. The rest of
          # `platform` stays out: pylsl and argostranslate are the heavy,
          # native-build members this deliberately does not pull in.
          pip install "wasmtime>=46,<48"
          # extism, the SECOND wasm runtime on the same package format, and a
          # direct consequence of the line above. test_wasm_plugin_package.py
          # opens with importorskip("wasmtime") only, but its TestExtismRuntime
          # class needs `extism` as well — a different package with its own
          # native runtime. While CI installed neither, the whole file skipped
          # and the mis-gating was invisible; installing wasmtime unskipped the
          # file and those five failed on an absent extism, with
          # ExtismPluginHost.start() returning a bare False that reads as a
          # broken host rather than a missing wheel.
          #
          # The class now carries its own importorskip, so a contributor
          # without extism gets an honest skip. Installing it here is the other
          # half: a permanent skip is the quieter version of the same defect.
          # 8.3 MB with extism-sys and cffi.
          pip install "extism>=1,<2"

      - name: "Lint — ruff (pyflakes: dead imports/vars, undefined names)"
        # The high-signal static-analysis gate. Config in pyproject
        # [tool.ruff.lint]: pyflakes + syntax, house-style rules off. A
        # contributor can't quietly land dead code or an undefined name.
        run: ruff check src/dreamlayer

      - name: "Lint — ruff over the repo's other Python"
        # The same ruleset, over the 61 files outside the package: dev scripts,
        # the demo kit, the examples, the companion. This ran nowhere. `ruff
        # check src/dreamlayer` is scoped to the package, so a syntax error or
        # an undefined name in scripts/ was found by running the script, and
        # the demo kit had accumulated 47 findings unseen.
        #
        # Brought to zero in the same commit, which is the only reason this can
        # be a gate rather than a backlog. Same rules as above, deliberately:
        # two ruff configurations drift, and the second one loses.
        #
        # `--config` is explicit because these paths are outside host-python/
        # where pyproject.toml lives; without it ruff falls back to its own
        # defaults and silently checks a different ruleset than the name of
        # this step claims.
        working-directory: .
        run: |
          ruff check --config host-python/pyproject.toml \
            scripts tools examples web laptop-companion

      - name: Typecheck — mypy over the whole dreamlayer package
        # Was 4 of 323 files behind --follow-imports=skip; the repo-wide typing
        # pass landed (audit 2026-07-14, Type-Safety C+ -> A-), so the gate now
        # covers the whole tree via [tool.mypy] in pyproject.toml
        # (ignore_missing_imports + follow_imports=silent, a pragmatic non-strict
        # baseline). The formal-methods safety core — contracts, budgets,
        # flash_safety, signer — stays fully typed and is covered by this run.
        # A documented ignore_errors backlog lives in [[tool.mypy.overrides]];
        # everything else, incl. the mixin<->host contract, is enforced. The
        # membership is asserted by DECIDED_TYPE_BACKLOG in test_lockfile.py
        # rather than listed here — this comment used to name the modules and
        # had already drifted (it said four and omitted vault_sync), which is
        # why the list is now somewhere a test can read it.
        # `python -m mypy` (not the bare `mypy` entrypoint) guarantees the type
        # checker runs under the same interpreter that installed the deps, so it
        # sees the packages it should — the entrypoint can resolve to a different
        # Python whose site-packages differ, silently changing what gets checked.
        run: python -m mypy src/dreamlayer

      - name: Run pytest
        # hardware/benchmark tests need a device or run only on demand.
        # --cov-fail-under is set 5 points below the measured total (90%) so
        # coverage can only rot LOUDLY — a drop fails the build.
        #
        # Every test in this run executes under the autouse no-cloud-egress
        # audit hook (tests/conftest.py): a process-wide socket.connect tripwire
        # that RAISES on any connection to a public host. So a green run is also
        # a standing proof that the whole suite reaches nothing but loopback/LAN
        # — the privacy claim, checked at the OS boundary, not by a self-counter.
        run: >
          pytest --tb=short -m "not hardware and not benchmark and not real_model and not allow_egress"
          --cov=dreamlayer --cov-report=term-missing --cov-fail-under=85

      - name: No-egress proof — run network-sensitive tests in an empty netns
        # Belt-and-suspenders to the in-process audit hook: run the actual
        # network-touching tests where the box has NO route off-device, so even a
        # deleted hook can't make egress succeed. `unshare -rn` maps our uid to
        # root in a fresh user+network namespace and we bring loopback up
        # (localhost-binding tests need it), but there is no default route, so any
        # public send fails at the kernel — and it actually EXECUTES the tests
        # (the prior version only self-tested unshare, refute 2026-07-18).
        #
        # This requires UNPRIVILEGED user namespaces. GitHub-hosted runners forbid
        # them ("write failed /proc/self/uid_map: Operation not permitted"), so we
        # PROBE first and skip cleanly there — the in-process audit hook already
        # proved zero egress in the main pytest step above; this leg is the extra
        # OS-boundary check for self-hosted runners that permit userns. It is
        # therefore never allowed to fail the build for lack of the capability;
        # only a real egress inside the netns fails it.
        run: |
          if ! command -v unshare >/dev/null; then
            echo "unshare unavailable; relying on the in-process audit hook"; exit 0
          fi
          if ! unshare -rn true 2>/dev/null; then
            echo "unprivileged user namespaces not permitted on this runner "\
                 "(GitHub-hosted); the in-process audit hook stands alone"; exit 0
          fi
          unshare -rn bash -c '
            ip link set lo up 2>/dev/null || true
            pytest --tb=short -p no:cacheprovider \
              src/dreamlayer/tests/test_no_egress.py \
              src/dreamlayer/tests/test_activity_receipt.py \
              src/dreamlayer/tests/test_capture_pipeline.py \
              src/dreamlayer/tests/test_ai_brain_server.py \
              src/dreamlayer/tests/test_primary_api_brain.py
          '

      - name: Jail tier — a capability denial enforced INSIDE a bwrap child
        # test_os_sandbox.py asserts argv *construction* — that `--unshare-net`
        # reached the command line. Nothing has ever asserted that the kernel
        # honoured it, so the OS-sandbox tier's enforcement ran in no
        # environment at all: the same hole the wasmtime install above closed
        # for the wasm tier, where 105 tests were green by skip.
        #
        # bubblewrap is installed HERE rather than in `Install dependencies`,
        # and that placement is load-bearing. With bwrap on PATH,
        # `os_sandbox.available()` starts returning "bwrap" for the whole
        # suite, which would silently change how every subprocess-plugin test
        # launches its child. This step changes one thing and reruns one file.
        #
        # `DL_SANDBOX=bwrap` is not a convenience either: the test reads the pin
        # as a promise that this machine has a working bwrap, and FAILS rather
        # than skipping when the promise is not kept. A skip that fires on every
        # runner is the same defect one layer up.
        #
        # And note what that buys and what it does not. In the `Run pytest` step
        # above, bwrap is deliberately absent, so this file skips there. Delete
        # this step and the whole enforcement file goes quietly back to skipping
        # everywhere, with no assertion moving anywhere — the exact shape it was
        # written against. This step is the only thing coupling it to a run.
        #
        # bwrap needs unprivileged user namespaces. The step above reports
        # GitHub-hosted runners refusing those outright for `unshare -rn`, and
        # recent Ubuntu images restrict them separately; which of the two binds
        # here has not been measured. The sysctl is therefore best-effort and a
        # no-op on an image without the knob. If bwrap still cannot run, the pin
        # makes the test say so out loud instead of skipping — that is the
        # intended failure mode, and the first run of this leg is what settles
        # which explanation was right.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          DL_SANDBOX=bwrap pytest --tb=short -p no:cacheprovider \
            src/dreamlayer/tests/test_os_sandbox_enforcement.py

  test-windows:
    # The Windows Brain is a shipping target (the tray app), so Windows
    # regressions must fail CI, not users. A targeted slice — the appliance
    # cores, the Brain server + indexer, and the Windows sources — runs on
    # windows-latest; the full suite, lint, and typecheck stay on the Linux
    # job above. The registry Run-entry round-trip test only executes here
    # (it's skipped everywhere else).
    runs-on: windows-latest

    defaults:
      run:
        working-directory: host-python

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: host-python/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev]"

      - name: Run pytest (appliance + ai_brain + indexer suites)
        run: >
          pytest --tb=short -m "not hardware and not benchmark and not real_model and not allow_egress"
          src/dreamlayer/tests/test_windows_appliance.py
          src/dreamlayer/tests/test_windows_panel_window.py
          src/dreamlayer/tests/test_windows_sources.py
          src/dreamlayer/tests/test_windows_hygiene.py
          src/dreamlayer/tests/test_mac_appliance.py
          src/dreamlayer/tests/test_ai_brain.py
          src/dreamlayer/tests/test_ai_brain_server.py
          src/dreamlayer/tests/test_ai_brain_macos.py
          src/dreamlayer/tests/test_brain_controls.py
          src/dreamlayer/tests/test_brain_capabilities.py
          src/dreamlayer/tests/test_brain_auth_posture.py
          src/dreamlayer/tests/test_brain_csrf_write_guard.py
          src/dreamlayer/tests/test_brain_tiers.py
          src/dreamlayer/tests/test_brain_rc.py
          src/dreamlayer/tests/test_server_atomic_stores.py
